<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090B">
<meta name="description" content="24 道生活化选择题，测你对应鬼灭之刃里的哪位正派人物。深色漫画风，不需要看过原作也能玩。">
<title>测一测｜你对应鬼灭之刃里的哪位人物（正派版）</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0C0D'/%3E%3Crect x='5' y='5' width='22' height='22' fill='%23E23A2C'/%3E%3Ctext x='16' y='23' font-size='15' text-anchor='middle' fill='%23F6F3EA' font-family='serif'%3E%E9%AC%BC%3C/text%3E%3C/svg%3E">
<style>
/* ================= 设计变量 ================= */
:root{
  --bg:#08090B;
  --bg-2:#101317;
  --paper:#EDE9DD;
  --paper-2:#E1DBCC;
  --ink:#0B0C0D;
  --red:#E23A2C;
  --red-d:#B32A1E;
  --jade:#2C8F6A;
  --ash:#98A0A6;
  --white:#F6F3EA;
  --line:rgba(246,243,234,.13);
  --disp:"Hiragino Sans GB","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --serif:"Songti SC","STSong","SimSun",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--white);font-family:var(--disp);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
[hidden]{display:none!important}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* 网点底 · 红色晕光 · 市松顶条 */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(circle at 88% 6%,rgba(226,58,44,.20),transparent 42%),
    radial-gradient(circle at 6% 92%,rgba(44,143,106,.14),transparent 46%),
    radial-gradient(rgba(246,243,234,.055) 1px,transparent 1.4px) 0 0/5px 5px,
    var(--bg);
}
.band{
  position:fixed;top:0;left:0;right:0;height:10px;z-index:60;
  background:repeating-conic-gradient(#12161A 0 25%,var(--jade) 0 50%) 0 0/18px 18px;
}
.side-mark{
  position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:1;
  writing-mode:vertical-rl;font-size:74px;line-height:1;letter-spacing:.24em;font-weight:900;
  color:transparent;-webkit-text-stroke:1px rgba(246,243,234,.10);pointer-events:none;user-select:none;
}
@media (max-width:900px){.side-mark{display:none}}

.app{width:100%;max-width:840px;margin:0 auto;padding:0 18px}
@media (min-width:768px){.app{padding:0 36px}}

/* ================= 通用按钮 ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:12px 20px;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);font-size:15px;font-weight:700;letter-spacing:.02em;
  transition:transform .12s ease,background .12s ease,color .12s ease;
}
.btn:hover{background:var(--paper-2)}
.btn:active{transform:translate(2px,2px)}
.btn-red{background:var(--red);color:#fff;border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn-red:hover{background:var(--red-d);color:#fff}
.btn-ghost{border-color:rgba(11,12,13,.35);color:#31353a}
.btn-ghost:disabled{opacity:.32;cursor:not-allowed}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

/* ================= 首页 ================= */
.home{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:64px 0 48px}
.kicker{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.22em;color:var(--ash)}
.kicker i{display:block;width:26px;height:2px;background:var(--red)}
.badge-red{
  display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:800;
  letter-spacing:.14em;padding:3px 9px;transform:rotate(-3deg);
}
.hero-title{
  margin:20px 0 0;font-size:clamp(38px,10.5vw,66px);line-height:1.08;font-weight:900;letter-spacing:-.02em;
}
.hero-title .hl{
  display:inline-block;background:var(--red);color:#fff;padding:0 .14em;margin:.04em 0;
  transform:rotate(-1.4deg);
}
.subtitle{margin:16px 0 0;font-size:14px;color:var(--ash);letter-spacing:.02em}
.intro{margin:14px 0 0;max-width:34em;font-size:15px;color:#cfd3d6;line-height:1.85}
.intro b{color:var(--white)}
.start-row{margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.btn-start{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 28px;border:2px solid var(--ink);background:var(--red);color:#fff;
  font-size:18px;font-weight:900;letter-spacing:.08em;
  box-shadow:7px 7px 0 rgba(246,243,234,.9);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn-start:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 rgba(246,243,234,.9)}
.btn-start:active{transform:translate(4px,4px);box-shadow:3px 3px 0 rgba(246,243,234,.9)}
.start-note{font-size:12px;color:var(--ash);letter-spacing:.06em}
.facts{margin:26px 0 0;display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none}
.facts li{border:1px solid var(--line);padding:4px 10px;font-size:12px;color:#c2c8cc;letter-spacing:.06em}

/* 队士名鉴 */
.cast{margin-top:34px}
.cast-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.cast-head h2{margin:0;font-size:12px;letter-spacing:.22em;color:var(--ash);font-weight:700}
.cast-head span{font-size:11px;color:#6d7479;letter-spacing:.1em}
.cast-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
@media (max-width:420px){.cast-row{grid-template-columns:repeat(4,1fr)}}
.cast-item{min-width:0}
.cast-item img{
  width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 18%;
  filter:grayscale(1) contrast(1.15) brightness(.95);
  border:1px solid rgba(246,243,234,.22);background:#101317;
}
.cast-item p{margin:5px 0 0;font-size:10px;line-height:1.3;color:#8f979d;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ================= 答题页 ================= */
.quiz{padding:0 0 40px}
.qbar{position:sticky;top:0;z-index:40;background:rgba(8,9,11,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.qbar-in{width:100%;max-width:840px;margin:0 auto;padding:14px 18px 12px}
@media (min-width:768px){.qbar-in{padding:16px 36px 14px}}
.qbar-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.q-stage{font-size:13px;letter-spacing:.12em;color:var(--ash);font-weight:700}
.q-stage em{font-style:normal;color:var(--white);font-size:18px;letter-spacing:.04em}
.q-count{font-size:13px;color:#6d7479;letter-spacing:.08em}
.q-count b{color:var(--red);font-size:20px}
.ticks{display:flex;gap:2px;margin-top:10px}
.ticks i{flex:1;height:5px;background:#262b30;transition:background .2s ease}
.ticks i.on{background:var(--red)}
.ticks i.now{background:var(--white)}
.qholder{display:flex;justify-content:center;align-items:center;min-height:calc(100svh - 118px);padding:30px 0 36px}
.qpaper{
  position:relative;width:100%;background:var(--paper);color:var(--ink);
  border:2px solid var(--ink);padding:36px 20px 0;
  box-shadow:10px 10px 0 rgba(246,243,234,.10),0 30px 60px rgba(0,0,0,.55);
}
@media (min-width:768px){.qpaper{padding:44px 40px 0}}
.qnum{
  position:absolute;top:-13px;left:16px;background:var(--red);color:#fff;
  font-size:12px;font-weight:900;letter-spacing:.16em;padding:4px 10px;
  box-shadow:3px 3px 0 var(--ink);
}
.qtext{margin:14px 0 22px;font-size:clamp(21px,5.4vw,29px);line-height:1.42;font-weight:900;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:13px 14px;min-height:54px;background:#F9F6EC;color:var(--ink);
  border:1.5px solid var(--ink);font-size:16px;line-height:1.5;
  transition:background .12s ease,transform .12s ease,box-shadow .12s ease;
}
.opt:hover{background:#E9E3D4}
.opt:active{transform:translateY(1px)}
.opt.sel{background:var(--red);color:#fff;transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.opt.sel .badge{background:#fff;color:var(--red);border-color:#fff}
.badge{
  flex:0 0 auto;display:grid;place-items:center;width:24px;height:24px;margin-top:2px;
  border:1.5px solid var(--ink);font-size:12px;font-weight:900;letter-spacing:0;
}
.qfoot{margin-top:22px;padding:16px 0 16px;border-top:1px dashed rgba(11,12,13,.28);display:flex;justify-content:space-between;align-items:center;gap:12px}
.qfoot .hint{font-size:12px;color:#6f6a5e;letter-spacing:.04em}
.btn-sm{padding:10px 16px;min-height:44px;font-size:14px}

/* ================= 结果页 ================= */
.result{padding:22px 0 56px}
.res-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.18em;color:var(--ash);padding-bottom:9px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.poster{
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  box-shadow:0 30px 70px rgba(0,0,0,.6);overflow:hidden;
}
.poster-art{position:relative;background:#0d0f12;overflow:hidden;aspect-ratio:1/1}
@media (min-width:768px){.poster-art{aspect-ratio:16/9}}
.poster-art img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.16) brightness(.97)}
.poster-art .dots{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(0,0,0,.55) 1px,transparent 1.3px);
  background-size:4px 4px;opacity:.28;mix-blend-mode:multiply;
}
.poster-art .shade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,9,11,.35) 0%,rgba(8,9,11,0) 38%,rgba(8,9,11,.72) 100%);
}
.seal{
  position:absolute;top:14px;left:14px;width:46px;height:46px;background:var(--red);
  display:grid;place-items:center;color:#fff;font-size:15px;font-weight:900;line-height:1.05;
  text-align:center;transform:rotate(-5deg);box-shadow:3px 3px 0 rgba(8,9,11,.6);letter-spacing:0;
}
.ep{
  position:absolute;top:18px;right:14px;background:rgba(8,9,11,.82);color:var(--white);
  font-size:11px;letter-spacing:.18em;padding:4px 9px;border:1px solid rgba(246,243,234,.34);
}
.nameplate{
  background:var(--ink);color:#fff;padding:16px 18px 18px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-top:2px solid var(--ink);
}
@media (min-width:768px){.nameplate{padding:22px 34px 24px}}
.np-left{min-width:0}
.np-left .dot{display:inline-block;width:9px;height:9px;background:var(--acc,#E23A2C);margin-right:8px;vertical-align:2px}
.char-name{margin:0;font-size:clamp(26px,7.4vw,42px);line-height:1.1;font-weight:900;letter-spacing:.01em}
.char-role{margin:8px 0 0;font-size:12px;letter-spacing:.16em;color:#f0a79f}
.np-right{text-align:right;flex:0 0 auto}
.pct{display:block;font-size:clamp(26px,6vw,34px);font-weight:900;color:var(--red);line-height:1}
.pct small{font-size:14px;font-weight:700}
.pct-cap{display:block;margin-top:3px;font-size:10px;letter-spacing:.18em;color:#8b9196}
.paper-body{padding:20px 18px 24px}
@media (min-width:768px){.paper-body{padding:28px 34px 34px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.chips li{border:1px solid var(--ink);padding:3px 9px;font-size:12px;letter-spacing:.04em;background:#fff}
.fit{margin:0 0 20px}
.fit-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.16em;color:#5b5f63;margin-bottom:6px}
.fit-top b{font-size:12px;color:var(--ink);letter-spacing:.06em}
.bar{height:9px;background:#C9C2B0;border:1px solid rgba(11,12,13,.4)}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.slogan{
  margin:0 0 22px;background:var(--ink);color:var(--white);padding:14px 16px;
  font-family:var(--serif);font-size:clamp(16px,4.4vw,19px);line-height:1.6;letter-spacing:.04em;
}
.slogan b{color:var(--red);font-weight:700}
.block{margin:0 0 22px}
.block h3{
  margin:0 0 10px;font-size:13px;letter-spacing:.14em;font-weight:900;color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.block h3::before{content:"";width:8px;height:8px;background:var(--red);display:block}
.block p{margin:0 0 10px;font-size:14px;line-height:1.85;color:#24282b}
.egg{border:1.5px dashed var(--red);padding:11px 12px;background:rgba(226,58,44,.05)}
.egg .tag{display:inline-block;background:var(--red);color:#fff;font-size:10px;letter-spacing:.14em;padding:2px 7px;margin-bottom:6px}
.egg p{margin:0;font-size:13px;color:#2a2e31}
.actions{display:grid;gap:10px;margin-top:24px}
@media (min-width:560px){.actions{grid-template-columns:1fr 1fr}}
.actions .btn{width:100%}
.note{margin:12px 0 0;font-size:11px;color:#6f6a5e;text-align:center;letter-spacing:.04em}
.all-toggle{
  width:100%;margin-top:20px;padding:13px 0;background:none;border:0;border-top:1px solid rgba(11,12,13,.28);
  display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.1em;color:#3d4247;font-weight:700;
}
.all-toggle .arw{font-size:14px;transition:transform .2s ease}
.all-toggle[aria-expanded="true"] .arw{transform:rotate(180deg)}
.all-list{margin-top:14px;display:grid;gap:10px}
.all-item{display:flex;align-items:center;gap:11px;min-width:0}
.all-item img{
  flex:0 0 auto;width:46px;height:46px;object-fit:cover;object-position:50% 20%;
  filter:grayscale(1) contrast(1.15);border:1px solid rgba(11,12,13,.5);
}
.all-item .nm{flex:0 0 6.9em;font-size:13px;font-weight:800;white-space:nowrap}
.all-item .ds{font-size:12px;color:#5f6468;min-width:0}
.disclaimer{margin:18px auto 0;max-width:36em;font-size:11px;line-height:1.7;color:#6b7177;text-align:center}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);z-index:80;
  background:var(--ink);color:var(--white);border:1px solid rgba(246,243,234,.28);
  padding:10px 18px;font-size:13px;letter-spacing:.04em;opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<aside class="side-mark" aria-hidden="true">全集中</aside>

<!-- ===== 视图：首页 ===== -->
<section id="view-home" class="view home">
  <div class="app">
    <div class="kicker"><i></i><span>鬼杀队 · 队士适性检查</span><span class="badge-red">正派版</span></div>
    <h1 class="hero-title">你体内<br>住着<span class="hl">哪一位队士</span>？</h1>
    <p class="subtitle">测一测｜你对应鬼灭之刃里的哪位人物（正派版）</p>
    <p class="intro">24 道没有标准答案的选择题。<b>不用认识他们，也能测</b>。凭第一反应选，别想太久——想太久就不是你了。</p>
    <div class="start-row">
      <button class="btn-start" id="start-btn" type="button">开始测验 <span aria-hidden="true">▶</span></button>
      <span class="start-note">做完立刻出结果，可以反复重测</span>
    </div>
    <ul class="facts">
      <li>24 道题</li><li>约 3 分钟</li><li>12 位队士</li><li>无标准答案</li>
    </ul>
    <div class="cast">
      <div class="cast-head"><h2>队士名鉴</h2><span>12 位 · 正派</span></div>
      <div class="cast-row" id="cast-strip"></div>
    </div>
  </div>
</section>

<!-- ===== 视图：答题 ===== -->
<section id="view-quiz" class="view quiz" hidden>
  <div class="qbar">
    <div class="qbar-in">
      <div class="qbar-top">
        <div class="q-stage">第 <em id="quiz-stage">01</em> 问</div>
        <div class="q-count"><b id="quiz-idx">1</b> / 24</div>
      </div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
    </div>
  </div>
  <div class="app">
    <div class="qholder">
      <div class="qpaper">
        <div id="quiz-body" style="display:contents"></div>
        <div class="qfoot">
          <button class="btn btn-ghost btn-sm" id="prev-btn" type="button">← 上一题</button>
          <div id="qfoot-right"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== 视图：结果 ===== -->
<section id="view-result" class="view result" hidden>
  <div class="app">
    <span id="result-card"></span>
    <p class="disclaimer">结果只是一面镜子，不是判决书。所有角色气质均为正向解读，与人物原作设定无关。</p>

</section>

<script>
/* ============================================================
   交互：首页 → 24 题 → 结果（纯前端，无后端）
   ============================================================ */
(function () {
  var RAW = JSON.parse(document.getElementById('quiz-data').textContent);
  var DIMS = RAW.dims, Q = RAW.questions, CHARS = RAW.chars;
  var LETTERS = ['A', 'B', 'C', 'D'];
  var TOTAL = Q.length;

  var state = { idx: 0, answers: new Array(TOTAL).fill(null), busy: false, result: null };

  var views = {
    home: document.getElementById('view-home'),
    quiz: document.getElementById('view-quiz'),
    result: document.getElementById('view-result')
  };
  var quizBody = document.getElementById('quiz-body');
  var ticksEl = document.getElementById('ticks');
  var idxEl = document.getElementById('quiz-idx');
  var stageEl = document.getElementById('quiz-stage');
  var prevBtn = document.getElementById('prev-btn');
  var resultCard = document.getElementById('result-card');
  var toastEl = document.getElementById('toast');

  /* ---------- 视图切换 ---------- */
  function go(name) {
    Object.keys(views).forEach(function (k) { views[k].hidden = (k !== name); });
    try { history.replaceState(null, '', '#/' + name); }
    catch (e) { location.hash = '#/' + name; }
    window.scrollTo(0, 0);
  }

  /* ---------- 首页队士名鉴 ---------- */
  document.getElementById('cast-strip').innerHTML = CHARS.map(function (c) {
    return '<div class="cast-item"><img src="' + (ART[c.id] || '') + '" alt="' + c.name + '" loading="lazy">' +
      '<p>' + (c.short || c.name) + '</p></div>';
  }).join('');

  /* ---------- 进度刻度 ---------- */
  for (var i = 0; i < TOTAL; i++) { ticksEl.appendChild(document.createElement('i')); }
  function paintTicks() {
    var ticks = ticksEl.children;
    for (var t = 0; t < TOTAL; t++) {
      ticks[t].className = state.answers[t] !== null ? 'on' : (t === state.idx ? 'now' : '');
    }
  }

  /* 24 题全部答完后，底部才出现「查看结果」 */
  function setFoot(allDone) {
    var foot = document.getElementById('qfoot-right');
    foot.innerHTML = allDone
      ? '<button class="btn btn-red btn-sm" id="finish-btn" type="button">查看结果 →</button>'
      : '<span class="hint">选完自动进入下一题</span>';
    var fin = document.getElementById('finish-btn');
    if (fin) fin.addEventListener('click', finish);
  }

  function renderQuiz() {
    var q = Q[state.idx], saved = state.answers[state.idx];
    idxEl.textContent = (state.idx + 1);
    stageEl.textContent = ('0' + (state.idx + 1)).slice(-2);
    paintTicks();
    prevBtn.disabled = state.idx === 0;
    setFoot(state.answers.every(function (a) { return a !== null; }));

    var optsHTML = q.opts.map(function (o, oi) {
      var cls = 'opt' + (saved === oi ? ' sel' : '');
      return '<button type="button" class="' + cls + '" data-oi="' + oi + '" aria-pressed="' + (saved === oi) + '">' +
        '<span class="badge">' + LETTERS[oi] + '</span><span class="txt">' + o.t + '</span></button>';
    }).join('');

    quizBody.innerHTML =
      '<div class="qcard">' +
        '<div class="qnum">QUESTION ' + ('0' + (state.idx + 1)).slice(-2) + '</div>' +
        '<h2 class="qtext">' + q.q + '</h2>' +
        '<div class="opts" role="group" aria-label="选项">' + optsHTML + '</div>' +
      '</div>';
  }

  /* ---------- 选择 ---------- */
  function choose(oi) {
    if (state.busy) return;
    var q = Q[state.idx];
    if (!q || !q.opts[oi]) return;
    state.busy = true;
    state.answers[state.idx] = oi;

    var buttons = quizBody.querySelectorAll('.opt');
    for (var b = 0; b < buttons.length; b++) {
      var on = Number(buttons[b].getAttribute('data-oi')) === oi;
      buttons[b].classList.toggle('sel', on);
      buttons[b].setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    setTimeout(function () {
      state.busy = false;
      if (state.idx < TOTAL - 1) {
        state.idx += 1;
        renderQuiz();
      } else {
        paintTicks();
        setFoot(true);
      }
    }, 320);
  }

  /* ---------- 计分：八维气质 + 去平均 + 余弦相似度 ---------- */
  function compute() {
    var user = {};
    DIMS.forEach(function (d) { user[d] = 0; });
    state.answers.forEach(function (oi, qi) {
      if (oi === null) return;
      var w = Q[qi].opts[oi].w;
      Object.keys(w).forEach(function (k) { user[k] += w[k]; });
    });

    var avg = {};
    DIMS.forEach(function (d) { avg[d] = 0; });
    CHARS.forEach(function (c) {
      DIMS.forEach(function (d) { avg[d] += (c.vec[d] || 0) / CHARS.length; });
    });

    var uNorm = Math.sqrt(DIMS.reduce(function (s, d) { return s + user[d] * user[d]; }, 0)) || 1;
    var ranked = CHARS.map(function (c) {
      var dot = 0, cNorm = 0;
      DIMS.forEach(function (d) {
        var cv = (c.vec[d] || 0) - avg[d];
        dot += user[d] * cv;
        cNorm += cv * cv;
      });
      var cos = dot / (uNorm * (Math.sqrt(cNorm) || 1));
      var z = (cos - c.cal[0]) / (c.cal[1] || 1);
      return { char: c, cos: cos, z: z };
    }).sort(function (a, b) { return (b.z - a.z) || (b.cos - a.cos); });

    var top = ranked[0];
    var pct = 82 + 15 * (1 / (1 + Math.exp(-(top.z - 2.2) * 1.3)));
    pct = Math.max(70, Math.min(98, Math.round(pct)));
    return { char: top.char, pct: pct, ranked: ranked };
  }

  /* ---------- 结果页 ---------- */
  function finish() {
    state.result = compute();
    renderResult();
    go('result');
  }

  function renderResult() {
    var r = state.result, c = r.char;
    document.documentElement.style.setProperty('--acc', c.color);

    var others = CHARS.filter(function (x) { return x.id !== c.id; });
    var allHTML = others.map(function (x) {
      return '<div class="all-item"><img src="' + (ART[x.id] || '') + '" alt="' + x.name + '" loading="lazy">' +
        '<span class="nm">' + x.name + '</span><span class="ds">' + x.mini + '</span></div>';
    }).join('');
    var chips = c.kw.map(function (k) { return '<li>' + k + '</li>'; }).join('');
    var whys = c.why.map(function (p) { return '<p>' + p + '</p>'; }).join('');

    resultCard.innerHTML =
      '<div class="res-head"><span>鬼杀队 · 队士适性检查</span><span>正派版</span></div>' +
      '<article class="poster">' +
        '<div class="poster-art">' +
          '<img src="' + (ART[c.id] || '') + '" alt="' + c.name + '" style="object-position:' + (c.pos || '50% 20%') + '">' +
          '<div class="dots"></div><div class="shade"></div>' +
          '<div class="seal">本命</div>' +
          '<div class="ep">FILE ' + ('0' + (CHARS.indexOf(c) + 1)).slice(-2) + ' / 12</div>' +
        '</div>' +
        '<div class="nameplate">' +
          '<div class="np-left">' +
            '<h2 class="char-name"><span class="dot"></span>' + c.name + '</h2>' +
            '<p class="char-role">' + c.breath + ' · ' + c.role + '</p>' +
          '</div>' +
          '<div class="np-right"><span class="pct">' + r.pct + '<small>%</small></span><span class="pct-cap">气质匹配度</span></div>' +
        '</div>' +
        '<div class="paper-body">' +
          '<ul class="chips">' + chips + '</ul>' +
          '<div class="fit"><div class="fit-top"><span>你的气质落点</span><b>系统判定：正派</b></div><div class="bar"><i id="fitbar"></i></div></div>' +
          '<p class="slogan"><b>「</b>' + c.slogan + '<b>」</b></p>' +
          '<div class="block"><h3>为什么是你</h3>' + whys + '</div>' +
          '<div class="block"><h3>隐藏特质 &amp; 小彩蛋</h3>' +
            '<p>' + c.secret + '</p>' +
            '<div class="egg"><span class="tag">彩蛋</span><p>' + c.egg + '</p></div>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn btn-red" id="retry" type="button">重新测试</button>' +
            '<button class="btn" id="copy" type="button">复制结果去分享</button>' +
          '</div>' +
          '<p class="note">截图发出去，问朋友一句：你测出来是谁？</p>' +
          '<button class="all-toggle" id="all-toggle" type="button" aria-expanded="false">' +
            '<span>其余 11 位队士，一句话认识</span><span class="arw">▾</span></button>' +
          '<div class="all-list" id="all-list" hidden>' + allHTML + '</div>' +
        '</div>' +
      '</article>';

    requestAnimationFrame(function () {
      var bar = document.getElementById('fitbar');
      if (bar) bar.style.width = r.pct + '%';
    });

    document.getElementById('retry').addEventListener('click', reset);
    document.getElementById('copy').addEventListener('click', function () {
      var text = '我测出来是「' + c.name + '」——' + c.slogan +
        '\n气质匹配度 ' + r.pct + '%。\n你也来测测：你对应鬼灭之刃里的哪位人物？（正派版）';
      copyText(text, this);
    });
    var toggle = document.getElementById('all-toggle');
    toggle.addEventListener('click', function () {
      var list = document.getElementById('all-list');
      var isOpen = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      list.hidden = isOpen;
      this.querySelector('span').textContent = isOpen ? '其余 11 位队士，一句话认识' : '收起名单';
    });
  }

  /* ---------- 重测 ---------- */
  function reset() {
    state.idx = 0;
    state.busy = false;
    state.result = null;
    state.answers = new Array(TOTAL).fill(null);
    renderQuiz();
    go('quiz');
  }

  /* ---------- 复制 ---------- */
  function copyText(text, btn) {
    function done() {
      var old = btn.textContent;
      btn.textContent = '已复制，去分享吧';
      showToast('结果已复制到剪贴板');
      setTimeout(function () { btn.textContent = old; }, 1800);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { showToast('复制失败，长按结果手动复制吧'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  }
  var toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  /* ---------- 事件 ---------- */
  document.getElementById('start-btn').addEventListener('click', function () {
    state.idx = 0;
    state.answers = new Array(TOTAL).fill(null);
    state.busy = false;
    renderQuiz();
    go('quiz');
  });

  quizBody.addEventListener('click', function (e) {
    var btn = e.target.closest('.opt');
    if (btn) choose(Number(btn.getAttribute('data-oi')));
  });

  prevBtn.addEventListener('click', function () {
    if (state.idx === 0 || state.busy) return;
    state.idx -= 1;
    renderQuiz();
  });

  document.addEventListener('keydown', function (e) {
    if (views.quiz.hidden) return;
    if (e.key >= '1' && e.key <= '4') choose(Number(e.key) - 1);
    if (e.key === 'ArrowLeft') prevBtn.click();
  });

  /* ---------- 初始路由 ---------- */
  var hash = location.hash.replace('#/', '');
  if (hash === 'quiz') { renderQuiz(); go('quiz'); }
  else { go('home'); }
})();
</script>
</body>
</html>
